# KoalaManaging Configuration

messages:
  prefix: "&8[&bKoala&8] &r"
  no-permission: "&cYou don't have permission to use this command."
  player-not-found: "&cPlayer not found."
  broadcast-format: "&4&l[BROADCAST] &r&f{message}"

settings:
  max-warnings-before-ban: 3
  freeze-blindness: true

# -------------------------------------------------------
# PLAYER REPORTS  (/report <player> <reason>)
# -------------------------------------------------------
report:
  # Seconds a reporter must wait between reports
  cooldown-seconds: 60
  # Minimum length of the reason (prevents "/report x a")
  min-reason-length: 4
  # Alert online staff (koala.report.notify) in-game when a report fires
  notify-staff: true

# -------------------------------------------------------
# DISCORD BOT
# Setup:
#  1. https://discord.com/developers/applications -> New Application -> Bot
#  2. Reset Token -> copy it into bot-token below
#  3. OAuth2 -> URL Generator -> scope: 'bot'
#     permissions: 'Send Messages' + 'Embed Links'
#  4. Invite the bot to your server with that URL.
#  5. Right-click the channel reports should go to -> Copy Channel ID
#     (Enable Developer Mode in Discord settings if you don't see it)
#  6. Paste it into report-channel-id below.
# -------------------------------------------------------
discord:
  bot-token: "YOUR_BOT_TOKEN_HERE"
  report-channel-id: "YOUR_CHANNEL_ID"
  report:
    title: "New Player Report"
    footer: "KoalaManaging"
    # Embed left-bar color as a decimal int (15158332 = red)
    color: 15158332

# -------------------------------------------------------
# CHAT FILTER
# -------------------------------------------------------
# Any message containing one of the banned words below is simply BLOCKED
# (the message is cancelled and never sent). No automatic muting happens.
# Add as many words as you like — just add another "- word" line.
chat-filter:
  enabled: true
  block-message: "&cYour message was blocked by the chat filter."

  banned-words:
    - "nigga"
    - "nigger"
    - "nga"
    - "ngas"
    - "rape"
    - "retard"

# -------------------------------------------------------
# AUTO BROADCAST
# -------------------------------------------------------
auto-broadcast:
  enabled: true
  interval: 300   # seconds between broadcasts (300 = 5 minutes)
  # Use & for colors. Use [text](url) for clickable links.
  # Example: "Join our Discord: [Click here](https://discord.gg/yourlink)"
  messages:
    - "&b&lKoala Network &8| &7Join our Discord: [&bClick here&7](https://discord.gg/yourlink)"
    - "&b&lKoala Network &8| &7Check our store: [&aClick here&7](https://store.yourserver.net)"
    - "&b&lKoala Network &8| &7Website: [&eKoalaNetwork.net&7](https://yourwebsite.net)"
